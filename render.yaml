# Render blueprint — one-command deploy of the CryptoFlow API + database.
# Docs: https://render.com/docs/blueprint-spec
#
# The frontend (frontend/) deploys separately as a static site (Netlify/Render
# Static) with VITE_API_BASE pointing at this service's URL.

# NOTE: no `databases:` block on purpose. Render's free Postgres is deleted
# ~30 days after creation, which silently killed the live demo once already.
# The database is an external, non-expiring free Postgres (Neon) instead —
# set DATABASE_URL manually in the Render dashboard (see below).

services:
  - type: web
    name: cryptoflow-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "pip install -r requirements.txt && python backend/manage.py collectstatic --noinput && python backend/manage.py migrate --noinput && python backend/manage.py seed_demo"
    startCommand: "gunicorn core.wsgi:application --chdir backend"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Neon Postgres connection string — set by hand in the Render dashboard
      # (sync: false keeps it out of the repo). Must include ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: DEPLOYED_FRONTEND_URL
        value: https://cryptofloww.netlify.app # the live Netlify frontend (CORS origin)
      - key: COINGECKO_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
